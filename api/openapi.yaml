openapi: 3.0.3
info:
  title: API de riesgo de hospitalización por COVID-19 (México)
  version: "1.0.0"
  description: |
    Endpoint REST de Databricks Model Serving que expone el modelo
    `workspace.covid_mx.modelo_hospitalizacion_covid@champion`.

    **Validación de entradas** (en el propio endpoint):
    1. La *signature* de MLflow rechaza columnas faltantes/sobrantes y tipos incorrectos.
    2. `modelo_covid.validar_entrada` aplica reglas de negocio: edad 0–110, binarias 0/1,
       entidad 1–32 (clave INEGI) y embarazo solo si `es_mujer = 1`.
    Cualquier violación responde **400** con el motivo.

    Puedes ver este archivo como Swagger UI pegándolo en https://editor.swagger.io
servers:
  - url: https://{workspace}.cloud.databricks.com
    variables:
      workspace:
        default: dbc-xxxxxxxx-xxxx
        description: Host de tu workspace de Databricks
security:
  - bearerAuth: []
paths:
  /serving-endpoints/covid-hospitalizacion/invocations:
    post:
      summary: Probabilidad de hospitalización de un paciente confirmado con COVID-19
      operationId: predecirHospitalizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Solicitud"
            example:
              dataframe_records:
                - es_mujer: 0
                  edad: 67
                  embarazo: 0
                  entidad_res: 14
                  diabetes: 1
                  epoc: 0
                  asma: 0
                  inmunosupresion: 0
                  hipertension: 1
                  cardiovascular: 0
                  obesidad: 1
                  renal_cronica: 0
                  tabaquismo: 0
                  otra_comorbilidad: 0
      responses:
        "200":
          description: Predicción por cada registro enviado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Respuesta"
              example:
                predictions:
                  - probabilidad: 0.62
                    hospitalizacion_predicha: 1
                    nivel_riesgo: alto
        "400":
          description: Entrada inválida (tipo, columna o regla de negocio)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error_code: BAD_REQUEST
                message: "'edad' debe estar entre 0 y 110"
        "401": { description: Token ausente o inválido }
        "403": { description: El token no tiene permiso sobre el endpoint }
        "404": { description: El endpoint no existe }
        "429": { description: Demasiadas solicitudes (el cliente reintenta con espera exponencial) }
        "503": { description: Endpoint escalando desde cero o no disponible (el cliente reintenta) }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal Access Token de Databricks
  schemas:
    Binaria:
      type: integer
      enum: [0, 1]
    Paciente:
      type: object
      additionalProperties: false
      required: [es_mujer, edad, embarazo, entidad_res, diabetes, epoc, asma, inmunosupresion,
                 hipertension, cardiovascular, obesidad, renal_cronica, tabaquismo, otra_comorbilidad]
      properties:
        es_mujer: { $ref: "#/components/schemas/Binaria" }
        edad: { type: integer, minimum: 0, maximum: 110 }
        embarazo:
          allOf: [{ $ref: "#/components/schemas/Binaria" }]
          description: Solo puede ser 1 si es_mujer = 1
        entidad_res:
          type: integer
          minimum: 1
          maximum: 32
          description: Clave INEGI de la entidad (14 = Jalisco, 9 = CDMX, 19 = Nuevo León…)
        diabetes: { $ref: "#/components/schemas/Binaria" }
        epoc: { $ref: "#/components/schemas/Binaria" }
        asma: { $ref: "#/components/schemas/Binaria" }
        inmunosupresion: { $ref: "#/components/schemas/Binaria" }
        hipertension: { $ref: "#/components/schemas/Binaria" }
        cardiovascular: { $ref: "#/components/schemas/Binaria" }
        obesidad: { $ref: "#/components/schemas/Binaria" }
        renal_cronica: { $ref: "#/components/schemas/Binaria" }
        tabaquismo: { $ref: "#/components/schemas/Binaria" }
        otra_comorbilidad: { $ref: "#/components/schemas/Binaria" }
    Solicitud:
      type: object
      required: [dataframe_records]
      properties:
        dataframe_records:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Paciente" }
    Prediccion:
      type: object
      properties:
        probabilidad: { type: number, minimum: 0, maximum: 1 }
        hospitalizacion_predicha:
          type: integer
          enum: [0, 1]
          description: 1 si probabilidad >= umbral óptimo de F1
        nivel_riesgo:
          type: string
          enum: [bajo, medio, alto]
    Respuesta:
      type: object
      properties:
        predictions:
          type: array
          items: { $ref: "#/components/schemas/Prediccion" }
    Error:
      type: object
      properties:
        error_code: { type: string }
        message: { type: string }
